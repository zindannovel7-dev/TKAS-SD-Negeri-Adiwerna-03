<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian TKAS - SDN Adiwerna 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #f0f4f8, #e2e8f0); min-height: 100vh; }
        .pro-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .gradient-header { background: linear-gradient(135deg, #1e3a8a, #2563eb); }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800">

    <header class="gradient-header text-white sticky top-0 z-30 px-6 py-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold tracking-wide">Ujian TKAS Online</h1>
                <p id="studentWelcome" class="text-xs text-blue-200">SDN Adiwerna 3 &bull; Memuat siswa...</p>
            </div>
            <div class="flex items-center gap-3">
                <div id="examTimerBox" class="bg-white/15 backdrop-blur-md px-4 py-2 rounded-xl text-xs font-bold border border-white/20 hidden">
                    ⏱️ Waktu: <span id="timerCountdown">--:--</span>
                </div>
                <button id="btnLogout" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition shadow-sm">Keluar</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-6 flex-grow flex flex-col justify-center">
        
        <!-- STEP 1: TOKEN INPUT -->
        <div id="loginCard" class="pro-card rounded-2xl p-8 max-w-md mx-auto w-full space-y-5">
            <div class="text-center">
                <h2 class="text-lg font-bold text-slate-900">Konfirmasi Token Ujian</h2>
                <p class="text-xs text-slate-500 mt-1">Masukkan token dari guru untuk memulai ujian</p>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Siswa (Login)</label>
                    <input type="text" id="displayStudentName" disabled class="w-full px-3.5 py-2.5 border rounded-xl bg-slate-100 text-sm font-bold text-slate-700 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Token Ujian (6 Karakter)</label>
                    <input type="text" id="tokenInput" placeholder="Contoh: A7B2X9" class="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 text-sm uppercase tracking-widest font-extrabold text-purple-700 outline-none">
                </div>
                <button onclick="startExam()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md transition">Mulai Mengerjakan Ujian</button>
            </div>
        </div>

        <!-- STEP 2: KERTAS SOAL UJIAN -->
        <div id="examCard" class="hidden flex flex-col gap-5">
            <div class="pro-card rounded-2xl p-6 flex justify-between items-center">
                <div>
                    <span id="packageNameBadge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700">Paket Soal</span>
                    <h3 class="text-sm font-bold text-slate-900 mt-1">Soal Nomor <span id="currentQuestionNum">1</span> dari <span id="totalQuestionNum">0</span></h3>
                </div>
                <div id="questionNavDots" class="flex flex-wrap gap-1 max-w-xs justify-end"></div>
            </div>

            <div class="pro-card rounded-2xl p-6 space-y-4">
                <p id="questionText" class="text-sm font-semibold text-slate-900 leading-relaxed"></p>
                <div id="optionsContainer" class="space-y-2.5"></div>
            </div>

            <div class="flex justify-between items-center">
                <button onclick="prevQuestion()" id="btnPrev" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 rounded-xl text-xs font-bold transition">Sebelumnya</button>
                <button onclick="nextQuestion()" id="btnNext" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md transition">Selanjutnya</button>
            </div>
        </div>

    </main>

    <!-- Footer Copyright -->
    <footer class="mt-auto py-6 text-center text-xs text-slate-500 border-t border-slate-200 bg-white/50 backdrop-blur-sm">
        <p class="font-semibold text-slate-700">NZ Production &bull; SDN Adiwerna 3</p>
        <p class="mt-1">&copy; 2026 Hak Cipta Dilindungi Undang-Undang.</p>
    </footer>

    <script>
        // 🔒 SISTEM PENGAMAN HALAMAN (SESSION GUARD UNTUK SISWA)
        let loggedInUser = null;
        (function() {
            try {
                loggedInUser = JSON.parse(localStorage.getItem('tkad_current_user'));
                if (!loggedInUser || loggedInUser.role !== 'student') {
                    alert('Akses Ditolak! Silakan login melalui halaman utama terlebih dahulu.');
                    window.location.href = 'index.html';
                }
            } catch (e) {
                window.location.href = 'index.html';
            }
        })();

        const SUPABASE_URL = 'https://xmqrddlcdfrylgzwviuo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcXJkZGxjZGZyeWxnend2aXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQyODYsImV4cCI6MjEwNTc1MDI4Nn0.6LJOxROS8uvb2XnnAd924VkvnXv5jpFJTI7mKS8YJ3o'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStudent = loggedInUser.Name || loggedInUser.name || loggedInUser.email;
        let currentPackage = '';
        let questionsList = [];
        let currentIndex = 0;
        let studentAnswers = {};
        let timerInterval = null;

        // Inisialisasi Nama di Input Token
        document.getElementById('displayStudentName').value = currentStudent;
        document.getElementById('studentWelcome').textContent = `${currentStudent} &bull; Siap Ujian`;

        document.getElementById('btnLogout').addEventListener('click', () => {
            Swal.fire({ title: 'Keluar sistem?', icon: 'question', showCancelButton: true, confirmButtonColor: '#2563eb', confirmButtonText: 'Ya' }).then(r => { 
                if(r.isConfirmed) { 
                    localStorage.removeItem('tkad_current_user'); 
                    window.location.href = 'index.html'; 
                } 
            });
        });

        async function startExam() {
            const token = document.getElementById('tokenInput').value.trim().toUpperCase();
            if(!token) { Swal.fire('Peringatan', 'Masukkan token ujian!', 'warning'); return; }

            let sessionData = JSON.parse(localStorage.getItem('tkad_token_session'));
            if(!sessionData || sessionData.token !== token) {
                Swal.fire('Token Salah', 'Token ujian tidak valid atau sudah kedaluwarsa.', 'error');
                return;
            }

            Swal.fire({ title: 'Memuat Soal...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const { data: qs } = await supabaseClient.from('questions').select('*').eq('is_active', true);

            if(!qs || qs.length === 0) {
                Swal.fire('Kosong', 'Belum ada paket soal yang diaktifkan oleh guru/admin.', 'warning');
                return;
            }

            questionsList = qs;
            currentPackage = qs[0].package_name || 'Paket A';

            // Mengirim status aktif ke Supabase bahwa siswa sedang mengerjakan
            await supabaseClient.from('active_sessions').upsert([
                { student_id: currentStudent, package_name: currentPackage, status: 'Sedang Mengerjakan', last_active: new Date() }
            ], { onConflict: 'student_id' });

            Swal.close();
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('examCard').classList.remove('hidden');
            document.getElementById('examTimerBox').classList.remove('hidden');
            document.getElementById('studentWelcome').textContent = `${currentStudent} &bull; Paket: ${currentPackage}`;
            document.getElementById('packageNameBadge').textContent = currentPackage;
            document.getElementById('totalQuestionNum').textContent = questionsList.length;

            startTimer();
            renderQuestion();
        }

        function startTimer() {
            let durationMinutes = parseInt(localStorage.getItem('tkad_exam_duration_minutes') || '60');
            let timeLeft = durationMinutes * 60;

            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    Swal.fire('Waktu Habis!', 'Ujian otomatis dikumpulkan.', 'info').then(() => submitExam());
                    return;
                }
                timeLeft--;
                let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                document.getElementById('timerCountdown').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }

        function renderQuestion() {
            const q = questionsList[currentIndex];
            document.getElementById('currentQuestionNum').textContent = currentIndex + 1;
            document.getElementById('questionText').textContent = q.question_text;

            const opts = q.option || { a: 'A', b: 'B', c: 'C', d: 'D' };
            let optHtml = '';
            
            ['a', 'b', 'c', 'd'].forEach(key => {
                if(opts[key]) {
                    let isChecked = studentAnswers[currentIndex] === key.toUpperCase() ? 'checked bg-blue-50 border-blue-500' : 'bg-slate-50 border-slate-200';
                    optHtml += `
                        <label class="flex items-center gap-3 p-3.5 rounded-xl border ${isChecked} cursor-pointer hover:bg-blue-50/50 transition">
                            <input type="radio" name="answer" value="${key.toUpperCase()}" ${studentAnswers[currentIndex] === key.toUpperCase() ? 'checked' : ''} onchange="saveAnswer('${key.toUpperCase()}' )" class="w-4 h-4 text-blue-600">
                            <span class="text-xs font-bold uppercase text-slate-700 w-5">${key}.</span>
                            <span class="text-xs text-slate-900 font-medium">${opts[key]}</span>
                        </label>
                    `;
                }
            });

            document.getElementById('optionsContainer').innerHTML = optHtml;

            document.getElementById('btnPrev').style.display = currentIndex === 0 ? 'none' : 'block';
            document.getElementById('btnNext').textContent = currentIndex === questionsList.length - 1 ? 'Kumpul & Selesai' : 'Selanjutnya';
            renderDots();
        }

        function saveAnswer(ans) {
            studentAnswers[currentIndex] = ans;
            renderDots();
        }

        function renderDots() {
            let html = '';
            questionsList.forEach((_, idx) => {
                let bg = studentAnswers[idx] ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700';
                if(idx === currentIndex) bg += ' ring-2 ring-blue-400';
                html += `<button onclick="goToQuestion(${idx})" class="w-7 h-7 rounded-lg text-xs font-bold ${bg}">${idx + 1}</button>`;
            });
            document.getElementById('questionNavDots').innerHTML = html;
        }

        function goToQuestion(idx) {
            currentIndex = idx;
            renderQuestion();
        }

        function prevQuestion() {
            if(currentIndex > 0) { currentIndex--; renderQuestion(); }
        }

        function nextQuestion() {
            if(currentIndex < questionsList.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                Swal.fire({
                    title: 'Kumpul Jawaban?',
                    text: 'Pastikan semua soal sudah dijawab dengan teliti.',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#2563eb',
                    confirmButtonText: 'Ya, Selesai'
                }).then(res => { if(res.isConfirmed) submitExam(); });
            }
        }

        async function submitExam() {
            clearInterval(timerInterval);
            Swal.fire({ title: 'Menghitung Nilai...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            let correctCount = 0;
            let detailedAnswers = [];

            questionsList.forEach((q, idx) => {
                let studentAns = studentAnswers[idx] || '-';
                let correctAns = (q.correct_answer || '').trim().toUpperCase();
                let isCorrect = studentAns === correctAns;
                if(isCorrect) correctCount++;

                detailedAnswers.push({
                    question_text: q.question_text,
                    student_answer: studentAns,
                    correct_answer: correctAns,
                    is_correct: isCorrect
                });
            });

            let finalScore = Math.round((correctCount / questionsList.length) * 100);

            // Simpan hasil nilai ke tabel exam_results
            await supabaseClient.from('exam_results').insert([{
                student_id: currentStudent,
                score: finalScore,
                detailed_answers: detailedAnswers,
                strengths_weaknesses: `Menjawab benar ${correctCount} dari ${questionsList.length} soal.`
            }]);

            // Perbarui status aktif menjadi 'Selesai' di active_sessions
            await supabaseClient.from('active_sessions').update({
                status: 'Selesai',
                last_active: new Date()
            }).eq('student_id', currentStudent);

            Swal.fire({
                title: 'Ujian Selesai!',
                html: `Skor Akhir Anda: <strong class="text-2xl text-blue-600">${finalScore}</strong>`,
                icon: 'success',
                confirmButtonText: 'Keluar'
            }).then(() => {
                localStorage.removeItem('tkad_current_user');
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
